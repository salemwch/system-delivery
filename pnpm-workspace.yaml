packages:
  - "apps/*"
  - "packages/*"

# Pin the toolchain so every machine and CI runner resolves identically.
# See docs/technology-decisions.md §7 — no floating ranges in production.
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - unrs-resolver

# Security overrides: EXACT versions only, each with the reason it exists.
# Remove an entry once the parent that pins the vulnerable version ships a fix.
overrides:
  # @nestjs/platform-fastify@11.2.7 pins its own fastify at 5.11.3, below the
  # 5.12.2 fix for an authentication bypass via malformed URLs (and 5.12.5 for
  # a DoS). The adapter builds the HTTP server from THAT copy, so bumping the
  # api's direct dependency alone would leave the vulnerable one serving.
  fastify: 5.12.5
  # eslint-plugin-boundaries (7.1.0, and still 7.2.0) pins handlebars 4.7.9:
  # critical JavaScript-injection advisories, fixed in 4.7.10. Patch-level, so
  # the plugin's template use is unchanged. Dev-only (lint time).
  handlebars: 4.7.10
  # apps/driver puts op-sqlite (and React Native) and babel-plugin-react-compiler
  # in the workspace, and pnpm then satisfies OTHER packages' optional peers
  # with them: drizzle-orm (apps/api) linked op-sqlite and React Native, and
  # next (web, merchant, track) linked the compiler plugin. Neither is used
  # there, and a `pnpm deploy --prod` of the API would have shipped React
  # Native. "-" removes those two edges only; the driver app is unaffected.
  "drizzle-orm>@op-engineering/op-sqlite": "-"
  "next>babel-plugin-react-compiler": "-"

# Audit exceptions: one GHSA per entry, each with why it is unreachable here.
# Reviewed 2026-10-10. Re-check whenever the parent package is upgraded.
auditConfig:
  ignoreGhsas:
    # braces@3.0.3 (stack-exhaustion DoS on deeply nested brace patterns). The
    # advisory has NO patched version. It is reached only through micromatch in
    # eslint-plugin-boundaries, which expands glob patterns written in this
    # repo's own lint config at lint time. The exploit needs attacker-controlled
    # patterns, and nothing in the shipped apps depends on it.
    - GHSA-vfj7-8cjw-p6xm
    # node-forge <=1.4.0 (RSA PKCS#1 v1.5 signature VERIFICATION accepts extra
    # nested DigestAlgorithm elements). The advisory has NO patched version. It
    # is reached only through @expo/cli (apps/driver), a developer-machine tool
    # that uses node-forge to parse an iOS signing certificate (the app is
    # Android-only) and to SIGN dev-server manifests; neither verifies an
    # untrusted RSA signature. None of it is bundled into the APK, which Metro
    # builds from the app's own imports. Reviewed 2026-10-19; re-check on every
    # expo / @expo/cli upgrade.
    - GHSA-86w9-cpqp-85rv
