# Local development infrastructure.
# NOT a production topology — see docs/09-infrastructure.md for that.
#
# Images are pinned by digest so every developer and CI run gets byte-identical
# services. Update deliberately, never implicitly (no :latest anywhere).

name: delivery-platform

services:
  # PostgreSQL 18 + TimescaleDB + PostGIS in one image.
  # timescaledb-ha bundles all three, so we run ONE database container rather
  # than bolting extensions onto a plain postgres image.
  postgres:
    image: timescale/timescaledb-ha:pg18@sha256:1d4d390575a09d383cde32df4c6fa8624a88dfb7105f712bac8857b2711d078a
    container_name: dp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Local-only tuning. Production values live in Terraform.
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Valkey — cache, driver presence, rate limiting, BullMQ job queue,
  # and the MVP event stream (see ADR-004).
  valkey:
    image: valkey/valkey:9.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: dp-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --save
      - "60 1"
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO — S3-compatible object storage for POD photos and signatures.
  # Stands in for DigitalOcean Spaces / AWS S3. The application only ever
  # speaks the S3 API, so swapping is a config change.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the POD bucket on first start so the app never has to.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: dp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-delivery-pod} &&
      mc anonymous set none local/${S3_BUCKET:-delivery-pod} &&
      echo 'MinIO bucket ready'
      "
    restart: "no"

  # OSRM — road-network routing and distance matrices.
  # Disabled by default: it needs a preprocessed Maghreb OSM extract, which is
  # a slow one-time build. Run `pnpm osrm:prepare` first, then:
  #   docker compose --profile routing up -d
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest@sha256:a7091038e39a73659767f34ef2d389909b42ea80b09bd2bdca482dce2991cbad
    container_name: dp-osrm
    profiles: ["routing"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 8000 /data/tunisia-latest.osrm
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./osrm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Nominatim — address geocoding from the SAME OpenStreetMap extract OSRM uses.
  #
  # Self-hosted rather than a commercial API: no per-request cost on bulk import,
  # and a customer's home address never leaves the deployment (the posture INPDP
  # expects for personal data). Coverage of informal Tunisian addressing is the
  # trade-off, which is why a commercial provider chains in behind it.
  #
  # Disabled by default. It imports the PBF on first boot — minutes for Tunisia,
  # once — into the named volume below:
  #   pnpm osrm:prepare        (downloads tunisia-latest.osm.pbf, shared)
  #   pnpm geocoder:up
  # then set GEOCODER=nominatim.
  nominatim:
    image: mediagis/nominatim:5.1@sha256:e07824605225985e74433e5b3d5e07b077e3aec868e48af18a7ee79025475db7
    container_name: dp-nominatim
    profiles: ["geocoding"]
    restart: unless-stopped
    environment:
      # Reuses the extract prepared for OSRM — one dataset to keep current, not two.
      PBF_PATH: /data/tunisia-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD:-nominatim_dev}
      # Import threads. Tunisia is small; this keeps the one-time import brief
      # without starving the rest of the local stack.
      THREADS: 4
    ports:
      - "${NOMINATIM_PORT:-8080}:8080"
    volumes:
      # The OSRM data directory, READ-ONLY: Nominatim only reads the PBF, and a
      # geocoder must not be able to corrupt the routing extract.
      - ./osrm-data:/data:ro
      # The imported database is large and slow to rebuild, so it outlives the
      # container.
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:8080/status' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      # The first boot imports the extract; do not report unhealthy while it runs.
      start_period: 15m

volumes:
  postgres-data:
  nominatim-data:
  valkey-data:
  minio-data:
